<!doctype html>
<!-- Imagen para compartir (WhatsApp, Instagram, Facebook): 1200×630.
     Se regenera con: node tools/imagen-compartir.mjs -->
<html lang="es-AR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  :root { --crema:#fff8f1; --ciruela:#7d3a5e; --tinta:#3a1f2d; --terracota:#a0533a; --durazno:#f2bc98; --rosa:#d9a3bc; }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:var(--crema); position:relative; font-family:"Space Grotesk",sans-serif; color:var(--tinta); }
  .blob { position:absolute; border-radius:50%; filter:blur(2px); }
  .b1 { width:520px; height:520px; right:-120px; top:-150px; background:var(--rosa); opacity:.35; }
  .b2 { width:380px; height:380px; right:170px; bottom:-200px; background:var(--durazno); opacity:.45; }
  .wrap { position:absolute; inset:0; padding:78px 90px 0; display:flex; flex-direction:column; }
  .logo { width:330px; height:auto; }
  h1 { margin-top:46px; font-family:"Fraunces",serif; font-weight:900; font-variation-settings:"SOFT" 100,"opsz" 144; font-size:112px; line-height:.98; letter-spacing:-2px; color:var(--ciruela); }
  h1 .dot { color:var(--terracota); }
  p { margin-top:30px; font-size:31px; line-height:1.3; max-width:820px; }
  .chips { margin-top:30px; display:flex; gap:12px; }
  .chip { font-size:22px; font-weight:500; padding:9px 20px; border-radius:999px; background:#fff; border:2px solid var(--ciruela); color:var(--ciruela); }
  .stripes { position:absolute; left:0; right:0; bottom:0; height:22px; display:flex; }
  .stripes span { flex:1; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <img class="logo" src="../assets/img/nevrado-logo.svg" alt="nevrado">
    <h1>Diseños que<br>se usan<span class="dot">.</span></h1>
    <p>Remeras, buzos, gorras y totes con diseños propios, estampados en nuestro taller de Córdoba.</p>
  </div>
  <div class="stripes"><span style="background:#a0533a"></span><span style="background:#f2bc98"></span><span style="background:#fff"></span><span style="background:#d9a3bc"></span><span style="background:#7d3a5e"></span></div>
</body>
</html>
